 # enable Rounded Path
[rounded_path]
resolution: 0.2 # the length of a circle approximation segments.
replace_g0: False # Use at your own risk

# enable Force Move
[force_move]
enable_force_move: True

[toolchanger]
# The example dropoff and pickup paths are configured to work with the Modular Dock.
# Do not adjust them unless you have a different dock or know what you are doing.
#params_dropoff_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
#params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':2}, {'y':9.5 ,'z':4}]
params_safe_toolhead_y: 120 # The distance from absolute zero to where the tool on the Shuttle clears the back of the tools in the dock. Allow some extra clearance.
params_close_y: 230 # The relative distance from safe_y the gantry moves to while changing tools.
params_safe_shuttle_y: 200
params_fast_speed: 9000 # Movement speed while outside of the dock during tool changes.
params_path_speed: 1000 # Movement speed used for pickup and dropoff during tool changes.
require_tool_present: True # Set to False to allow toolless movement. Toolless movement should be used with caution.
error_gcode:
    PAUSE

  before_change_gcode:
  {% set tn = "T"+(tool.tool_number|string) %}
  {% if printer["gcode_macro " + tn ] %}
     SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="''"
  {% endif %}

after_change_gcode:
  {% set tn = "T"+(tool.tool_number|string) %}
  {% if printer["gcode_macro " + tn ] %}
     SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="'c44'"
  {% endif %}
  {% if tool.params_input_shaper_freq_x %}
    SET_INPUT_SHAPER SHAPER_FREQ_X={tool.params_input_shaper_freq_x} SHAPER_FREQ_Y={tool.params_input_shaper_freq_y}
  {% endif %}

dropoff_gcode:
  {% set park_x = tool.params_park_x|float %}
  {% set detach_x = tool.params_detach_x|float %}
  {% set fast = tool.params_fast_speed|float %}
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set cur_z = printer.toolhead.position[2]|float %}
  RESPOND TYPE=echo MSG='Dropping off {tool.name}'
  G90
  ; Move 1 mm up to avoid crashing into things
  G0 Z{ [cur_z+5.0, max_z]|min } F{fast}
  #   ##############  Move up to the dock  ##############
  # NOTE - IDEALLY, REENABLE THIS FOR SAFETY.
  #STOP_TOOL_PROBE_CRASH_DETECTION
  G0 Y{tool.params_safe_toolhead_y} F{fast}
  G0 X{detach_x} F{fast}
  G0 Y{tool.params_park_y} F{fast}
  #  ############## Run the path ##############
  G0 X{park_x} F{tool.params_path_speed}
  G0 Y{tool.params_close_y} F{tool.params_path_speed}
  G0 X{detach_x} F{fast}
  G0 Y{tool.params_safe_shuttle_y} F{fast}
  G90

pickup_gcode:
  {% set park_x = tool.params_park_x|float %}
  {% set detach_x = tool.params_detach_x|float %}
  {% set fast = tool.params_fast_speed|float %}
  
  RESPOND TYPE=echo MSG='Picking up {tool.name}'
  RESPOND TYPE=echo MSG='Extruder is {tool.extruder}'
  RESPOND TYPE=echo MSG='{printer[tool.extruder]}'
  G90
  #   ##############  Fast to the last point  ##############
  G0 Y{tool.params_safe_shuttle_y} F{fast}
  G0 X{park_x} F{fast}
  G0 Y{tool.params_close_y} F{fast}
  # Wait for temp before actually picking up the tool, while the nozzle is resting on it's pad.
  {% if tool.extruder %}
    #M109 T{tool.tool_number} S{printer[tool.extruder].target|int}
    M104 T{tool.tool_number} S{printer[tool.extruder].target|int}
    _WAIT_FOR_TEMP_WITHIN_TOLERANCE HEATER={tool.extruder} TOLERANCE=3
  {% endif %}
  G0 Y{tool.params_detach_y} F{tool.params_path_speed}
  G0 X{tool.params_detach_x} F{fast}
  #G0 Y{tool.params_park_y} F{tool.params_path_speed}
  #G0 Y{tool.params_close_y} F{tool.params_path_speed}
  #G0 X{detach_x} F{tool.params_path_speed}
  #G0 Y{tool.params_safe_toolhead_y} F{fast}
  
  {% if 'Z' in restore_position %}
    G0 Z{restore_position.Z} F{fast}
  {% endif %}
  {% if 'Y' in restore_position %}
    G0 Y{restore_position.Y} F{fast}
  {% endif %}
  {% if 'X' in restore_position %}
    G0 X{restore_position.X} F{fast}
  {% endif %}

  # NOTE - IDEALLY, REENABLE THIS FOR SAFETY.
  #START_TOOL_PROBE_CRASH_DETECTION T={tool.tool_number}
  G90

[gcode_macro _INITIALIZE_FROM_DETECTED_TOOL]
gcode:
  {% if printer.tool_probe_endstop.active_tool_number | int == -1 %}
    RESPOND TYPE=error MSG='Failed to detect active tool'
    PAUSE
  {% else %}
    INITIALIZE_TOOLCHANGER T={printer.tool_probe_endstop.active_tool_number}
  {% endif %}
