## Set up MCU temperature readings and bed heater.

[temperature_sensor BTT_PI]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor MCU]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[heater_bed]
heater_pin: PA1                      # Connected to BED_OUT
sensor_type: Generic 3950
sensor_pin: PF3                      # Connected to slot TB
min_temp: 0
max_temp: 120
max_power: 1.0
pwm_cycle_time: 0.01
#control: pid                         # REQUIRES CALIBRATION!
#pid_Kp: 74.743
#pid_Ki: 2.195
#pid_Kd: 636.252




