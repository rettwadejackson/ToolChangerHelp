[respond]
[include chopper_tune.cfg]
[include mainsail.cfg]
[include home.cfg]
[include KAMP_Settings.cfg]
[include macros.cfg]
[include K-ShakeTune/*.cfg]
[include T0.cfg]
[include T1.cfg]
[include Toolchanger.cfg]
[include Toolchanger_Macros.cfg]
#[include ToolDetection.cfg]
[include offset_save_file.cfg]
#[include config_backup.cfg]

[mcu]
#serial: /dev/serial/by-id/           # Insert your MCU serial ID here - (ls -l /dev/serial/by-id/)
canbus_uuid: bb62fa80ce58

[rounded_path]
resolution: 0.2                            # Arc segment length (mm)
replace_G0: false                          # Don't round travel moves

[printer]
kinematics: corexy
max_velocity: 650                    # Adjust based on your setup, 500 mm/s works fine with stock Creality stepper motors.
max_accel: 15000                     # Adjust based on your setup, 10000 mm/s2 works fine with stock Creality stepper motors.
square_corner_velocity: 5.0
max_z_velocity: 10
max_z_accel: 250

[idle_timeout]
timeout: 10800

[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 60

[gcode_arcs]
resolution: 0.1

[force_move]
enable_force_move: True

[skew_correction]

[auto_speed]

[resonance_tester]
accel_chip: adxl345
probe_points:
    114.5, 117.5, 10

