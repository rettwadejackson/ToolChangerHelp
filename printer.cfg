## Section to setup stepper motors, endstops and stepper motor drivers.

## B STEPPER MOTOR - LEFT
## Connected to slot MOTOR0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop #PG6                     # Connected to slot DIAG0
position_endstop: 0
position_max: 232
homing_speed: 25
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: ^PG6
#run_current: .6                     # Current for stock Creality 42-34 stepper motors.
interpolate: true
driver_SGTHRS: 80 # tune this once it's working
stealthchop_threshold: 999999

#[autotune_tmc stepper_x]
#motor: my_custom_motor
#tuning_goal: auto
#extra_hysteresis: 2
#toff: 0
#sgt:58
#sg4_thrs: 24

## A STEPPER MOTOR - RIGHT
## Connected to slot MOTOR1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 64
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop #PG9                     # Connected to slot DIAG1
position_endstop: 250
position_max: 250
position_min: 0
homing_speed: 25
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: ^PG9
#run_current: .6                     # Current for stock Creality 42-34 stepper motors.
interpolate: true
driver_SGTHRS: 90 # tune this once it's working
stealthchop_threshold: 999999

#[autotune_tmc stepper_y]
#motor: my_custom_motor
#tuning_goal: auto
#extra_hysteresis: 2
#toff: 0
#sgt: 60
#sg4_thrs: 24

## Z STEPPER MOTOR
## Connected to slot MOTOR2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 235
position_min: -2.5
homing_speed: 5
second_homing_speed: 3
homing_retract_speed: 2
homing_retract_dist: 5

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.65                     # Current for stock Creality stepper motor - can be increased if required.
stealthchop_threshold: 999999
interpolate: true

[motor_constants my_custom_motor]
# Coil resistance, Ohms
resistance: 2
# Coil inductance, Henries
inductance: 0.0048
# Holding torque, Nm
holding_torque: 0.51
# Nominal rated current, Amps
max_current: 1.7
# Steps per revolution (1.8deg motors use 200, 0.9deg motors use 400)
steps_per_revolution: 200

